name: Build UACG home pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uacg-home-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: node:24-bookworm-slim
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test route selection and generated pages
        run: npm test
      - name: Build static address pages
        run: npm run build
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
